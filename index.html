<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08080a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>书架</title>
    <style>
      :root {
        --bg: #08080a;
        --surface: #121214;
        --elevated: #1a1a1e;
        --gold: #e8c547;
        --gold-soft: rgba(232, 197, 71, 0.14);
        --gold-line: rgba(232, 197, 71, 0.22);
        --text: #f0ebe0;
        --muted: rgba(240, 235, 224, 0.45);
        --radius: 12px;
        --bar-h: 48px;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "SF Pro Text", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", system-ui, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      /* —— 顶栏：极简 —— */
      .bar {
        flex: 0 0 auto;
        height: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
        padding: env(safe-area-inset-top, 0px) 10px 0;
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(12, 12, 14, 0.92);
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        z-index: 20;
        transition: transform 0.28s ease, opacity 0.28s ease;
      }

      .bar .title {
        flex: 1;
        min-width: 0;
        text-align: center;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.2px;
        color: var(--text);
        opacity: 0.92;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 4px;
      }

      .icon-btn {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--text);
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        opacity: 0.75;
        transition: background 0.15s, opacity 0.15s, transform 0.1s;
        font-family: inherit;
        padding: 0;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        opacity: 1;
        background: rgba(255, 255, 255, 0.06);
      }
      .icon-btn:active {
        transform: scale(0.92);
        background: var(--gold-soft);
        color: var(--gold);
      }
      .icon-btn:disabled {
        opacity: 0.25;
        pointer-events: none;
      }
      .icon-btn.accent {
        color: var(--gold);
        opacity: 0.95;
      }

      /* —— 阅读区 —— */
      .stage {
        flex: 1;
        min-height: 0;
        position: relative;
        background: #050506;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        touch-action: pan-y;
        cursor: default;
      }

      #viewer {
        max-width: 100%;
        max-height: 100%;
        background: #0e0e10;
        border-radius: 2px;
        box-shadow: 0 4px 48px rgba(0, 0, 0, 0.65);
      }

      /* —— 底栏 —— */
      .bar.bottom {
        height: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px));
        padding: 0 10px env(safe-area-inset-bottom, 0px);
        border-bottom: none;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
        justify-content: center;
      }

      .pager {
        display: flex;
        align-items: center;
        gap: 4px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 999px;
        padding: 2px 4px;
      }

      .page-input {
        width: 44px;
        height: 32px;
        border: none;
        background: transparent;
        color: var(--gold);
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        font-family: inherit;
        outline: none;
        -moz-appearance: textfield;
      }
      .page-input::-webkit-outer-spin-button,
      .page-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .page-total {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        padding-right: 6px;
        min-width: 28px;
      }

      /* 沉浸：点阅读区可隐藏栏 */
      body.immersive .bar {
        transform: translateY(-100%);
        opacity: 0;
        pointer-events: none;
      }
      body.immersive .bar.bottom {
        transform: translateY(100%);
      }

      /* —— 加载 —— */
      .loading {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(8, 8, 10, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .loading.show {
        display: flex;
      }
      .loading-label {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.3px;
      }
      .progress-track {
        width: min(56vw, 220px);
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: var(--gold);
        transition: width 0.12s linear;
      }
      .progress-pct {
        font-size: 12px;
        font-weight: 600;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.5px;
      }

      /* —— 书架 —— */
      .shelf {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.22s ease, visibility 0.22s ease;
      }
      .shelf.show {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      .shelf-panel {
        width: min(100%, 400px);
        max-height: min(72vh, 520px);
        overflow: auto;
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-bottom: none;
        border-radius: 18px 18px 0 0;
        padding: 8px 12px max(14px, env(safe-area-inset-bottom));
        box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.45);
        transform: translateY(16px);
        transition: transform 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .shelf.show .shelf-panel {
        transform: translateY(0);
      }
      .shelf-handle {
        width: 36px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        margin: 4px auto 12px;
      }
      .shelf-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        padding: 0 4px;
      }
      .shelf-head span {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: 0.3px;
      }
      .book-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .book-item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 12px;
        border-radius: var(--radius);
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        text-align: left;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.15s, border-color 0.15s;
      }
      .book-item:active {
        background: var(--gold-soft);
        border-color: var(--gold-line);
      }
      .book-item.missing {
        opacity: 0.32;
        cursor: default;
      }
      .book-item .ico {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: var(--gold-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
      }
      .book-item.missing .ico {
        background: rgba(255, 255, 255, 0.04);
      }
      .book-item .meta {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .book-item .t {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .book-item .s {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .scanning,
      .empty {
        text-align: center;
        padding: 32px 8px;
        color: var(--muted);
        font-size: 13px;
      }

      @media (min-width: 720px) {
        .shelf {
          align-items: center;
        }
        .shelf-panel {
          border-radius: 18px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.06);
          transform: translateY(8px) scale(0.98);
        }
        .shelf.show .shelf-panel {
          transform: translateY(0) scale(1);
        }
        .shelf-handle {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="bar top">
      <button type="button" class="icon-btn accent" id="btn-shelf" title="书架" aria-label="书架">
        ☰
      </button>
      <div class="title" id="doc-title"></div>
      <button type="button" class="icon-btn" id="btn-zoom-out" title="缩小" aria-label="缩小">−</button>
      <button type="button" class="icon-btn" id="btn-zoom-in" title="放大" aria-label="放大">+</button>
      <button type="button" class="icon-btn" id="btn-fs" title="全屏" aria-label="全屏">⛶</button>
    </header>

    <main class="stage" id="stage">
      <canvas id="viewer" hidden></canvas>
      <div class="loading" id="loading" aria-live="polite">
        <div class="progress-track">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="progress-pct" id="progress-pct">0%</div>
        <div class="loading-label" id="loading-label"></div>
      </div>
    </main>

    <footer class="bar bottom">
      <div class="pager">
        <button type="button" class="icon-btn" id="btn-prev" title="上一页" aria-label="上一页" disabled>
          ‹
        </button>
        <input
          class="page-input"
          id="page-input"
          type="number"
          min="1"
          value="1"
          inputmode="numeric"
          aria-label="页码"
          disabled
        />
        <span class="page-total" id="page-total">/ —</span>
        <button type="button" class="icon-btn" id="btn-next" title="下一页" aria-label="下一页" disabled>
          ›
        </button>
      </div>
    </footer>

    <div class="shelf" id="shelf" aria-hidden="true">
      <div class="shelf-panel" role="dialog" aria-label="书架">
        <div class="shelf-handle"></div>
        <div class="shelf-head">
          <span>书架</span>
          <button type="button" class="icon-btn" id="btn-shelf-close" aria-label="关闭">✕</button>
        </div>
        <ul class="book-list" id="book-list"></ul>
        <div class="empty" id="book-empty" hidden>暂无可用书籍</div>
      </div>
    </div>

    <script type="module">
      import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs";
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs";

      const BOOKS = [
        { file: "anne-of-green-gables.pdf", title: "Anne of Green Gables", sub: "绿山墙的安妮" },
        { file: "outlaws_of_the_marsh.pdf", title: "Outlaws of the Marsh", sub: "水浒传" },
        { file: "jourwest.pdf", title: "Journey to the West", sub: "西游记" },
        { file: "4.pdf", title: "Book 4", sub: "4.pdf" },
        { file: "5.pdf", title: "Book 5", sub: "5.pdf" },
        { file: "6.pdf", title: "Book 6", sub: "6.pdf" },
        { file: "7.pdf", title: "Book 7", sub: "7.pdf" },
      ];

      function bookUrl(file) {
        return new URL(file, document.baseURI).href;
      }

      const els = {
        stage: document.getElementById("stage"),
        canvas: document.getElementById("viewer"),
        loading: document.getElementById("loading"),
        loadingLabel: document.getElementById("loading-label"),
        progressBar: document.getElementById("progress-bar"),
        progressPct: document.getElementById("progress-pct"),
        docTitle: document.getElementById("doc-title"),
        pageInput: document.getElementById("page-input"),
        pageTotal: document.getElementById("page-total"),
        btnPrev: document.getElementById("btn-prev"),
        btnNext: document.getElementById("btn-next"),
        btnZoomIn: document.getElementById("btn-zoom-in"),
        btnZoomOut: document.getElementById("btn-zoom-out"),
        btnFs: document.getElementById("btn-fs"),
        btnShelf: document.getElementById("btn-shelf"),
        btnShelfClose: document.getElementById("btn-shelf-close"),
        shelf: document.getElementById("shelf"),
        bookList: document.getElementById("book-list"),
        bookEmpty: document.getElementById("book-empty"),
      };

      let pdfDoc = null;
      let pageNum = 1;
      let scale = 1;
      let rendering = false;
      let pendingPage = null;
      let currentBook = null;
      let availableCache = null;

      function setProgress(p) {
        p = Math.max(0, Math.min(100, p | 0));
        els.progressBar.style.width = p + "%";
        els.progressPct.textContent = p + "%";
      }

      function showLoading(label) {
        els.loading.classList.add("show");
        els.loadingLabel.textContent = label || "";
        setProgress(0);
      }

      function hideLoading() {
        els.loading.classList.remove("show");
      }

      function updateNav() {
        const n = pdfDoc ? pdfDoc.numPages : 0;
        els.pageTotal.textContent = n ? "/ " + n : "/ —";
        els.pageInput.value = pageNum;
        els.pageInput.max = n || 1;
        els.pageInput.disabled = !pdfDoc;
        els.btnPrev.disabled = !pdfDoc || pageNum <= 1;
        els.btnNext.disabled = !pdfDoc || pageNum >= n;
      }

      async function renderPage(num) {
        if (!pdfDoc) return;
        if (rendering) {
          pendingPage = num;
          return;
        }
        rendering = true;
        try {
          const page = await pdfDoc.getPage(num);
          const base = page.getViewport({ scale: 1 });
          const stageW = els.stage.clientWidth - 12;
          const stageH = els.stage.clientHeight - 12;
          const fit = Math.min(stageW / base.width, stageH / base.height);
          const viewport = page.getViewport({ scale: fit * scale });

          const canvas = els.canvas;
          const ctx = canvas.getContext("2d", { alpha: false });
          const outputScale = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.floor(viewport.width * outputScale);
          canvas.height = Math.floor(viewport.height * outputScale);
          canvas.style.width = Math.floor(viewport.width) + "px";
          canvas.style.height = Math.floor(viewport.height) + "px";
          canvas.hidden = false;

          const transform =
            outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

          ctx.fillStyle = "#0e0e10";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          await page.render({
            canvasContext: ctx,
            viewport,
            transform,
          }).promise;

          pageNum = num;
          updateNav();
          try {
            localStorage.setItem(
              "tp_pdf_pos_" + (currentBook && currentBook.file),
              String(pageNum)
            );
          } catch (e) {}
        } catch (err) {
          console.error(err);
          els.loadingLabel.textContent = "渲染失败";
        } finally {
          rendering = false;
          if (pendingPage !== null && pendingPage !== pageNum) {
            const p = pendingPage;
            pendingPage = null;
            renderPage(p);
          } else {
            pendingPage = null;
          }
        }
      }

      function goTo(num) {
        if (!pdfDoc) return;
        num = Math.max(1, Math.min(pdfDoc.numPages, num | 0));
        renderPage(num);
      }

      async function loadBook(book) {
        currentBook = book;
        els.docTitle.textContent = book.title;
        document.body.classList.remove("immersive");
        showLoading("");
        closeShelf();

        if (pdfDoc) {
          try {
            await pdfDoc.destroy();
          } catch (e) {}
          pdfDoc = null;
        }

        const url = bookUrl(book.file);

        try {
          const data = await fetchWithProgress(url, (p) => setProgress(p));
          setProgress(100);

          const loadingTask = pdfjsLib.getDocument({ data });
          pdfDoc = await loadingTask.promise;

          let start = 1;
          try {
            const saved = parseInt(
              localStorage.getItem("tp_pdf_pos_" + book.file) || "1",
              10
            );
            if (saved >= 1 && saved <= pdfDoc.numPages) start = saved;
          } catch (e) {}

          scale = 1;
          hideLoading();
          await renderPage(start);
        } catch (err) {
          console.error(err);
          els.loadingLabel.textContent = "加载失败";
          setProgress(0);
          setTimeout(hideLoading, 1400);
          els.canvas.hidden = true;
          els.docTitle.textContent = "";
          pdfDoc = null;
          updateNav();
        }
      }

      function fetchWithProgress(url, onProgress) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("GET", url, true);
          xhr.responseType = "arraybuffer";
          xhr.onprogress = (e) => {
            if (e.lengthComputable && e.total > 0) {
              onProgress(Math.floor((e.loaded / e.total) * 100));
            } else if (e.loaded > 0) {
              onProgress(Math.min(90, 8 + Math.floor(e.loaded / 80000)));
            }
          };
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 400) {
              onProgress(100);
              resolve(new Uint8Array(xhr.response));
            } else {
              reject(new Error("HTTP " + xhr.status));
            }
          };
          xhr.onerror = () => reject(new Error("network"));
          xhr.ontimeout = () => reject(new Error("timeout"));
          xhr.send();
        });
      }

      function probe(file) {
        return new Promise((resolve) => {
          const xhr = new XMLHttpRequest();
          xhr.open("HEAD", bookUrl(file), true);
          xhr.timeout = 6000;
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 400) resolve(true);
            else if (xhr.status === 405 || xhr.status === 501) {
              const g = new XMLHttpRequest();
              g.open("GET", bookUrl(file), true);
              g.timeout = 6000;
              g.onprogress = (e) => {
                if (e.loaded > 0) {
                  g.abort();
                  resolve(true);
                }
              };
              g.onload = () => resolve(g.status >= 200 && g.status < 400);
              g.onerror = g.ontimeout = () => resolve(false);
              g.send();
            } else resolve(false);
          };
          xhr.onerror = xhr.ontimeout = () => resolve(false);
          xhr.send();
        });
      }

      async function openShelf() {
        document.body.classList.remove("immersive");
        els.shelf.classList.add("show");
        els.shelf.setAttribute("aria-hidden", "false");
        els.bookList.innerHTML = '<li class="scanning">…</li>';
        els.bookEmpty.hidden = true;

        if (!availableCache) {
          const results = await Promise.all(
            BOOKS.map(async (b) => ({ book: b, ok: await probe(b.file) }))
          );
          availableCache = results;
        }

        const okList = availableCache.filter((x) => x.ok).map((x) => x.book);
        const missList = availableCache.filter((x) => !x.ok).map((x) => x.book);

        els.bookList.innerHTML = "";
        if (!okList.length) {
          els.bookEmpty.hidden = false;
        } else {
          okList.forEach((book) => {
            const li = document.createElement("li");
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "book-item";
            btn.innerHTML =
              '<span class="ico">📖</span><span class="meta"><span class="t"></span><span class="s"></span></span>';
            btn.querySelector(".t").textContent = book.title;
            btn.querySelector(".s").textContent = book.sub;
            btn.addEventListener("click", () => loadBook(book));
            li.appendChild(btn);
            els.bookList.appendChild(li);
          });
        }
        missList.forEach((book) => {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "book-item missing";
          btn.disabled = true;
          btn.innerHTML =
            '<span class="ico">—</span><span class="meta"><span class="t"></span><span class="s"></span></span>';
          btn.querySelector(".t").textContent = book.title;
          btn.querySelector(".s").textContent = "暂缺";
          li.appendChild(btn);
          els.bookList.appendChild(li);
        });
      }

      function closeShelf() {
        els.shelf.classList.remove("show");
        els.shelf.setAttribute("aria-hidden", "true");
      }

      function toggleFullscreen() {
        const root = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          const req = root.requestFullscreen || root.webkitRequestFullscreen;
          if (req) req.call(root);
        } else {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) exit.call(document);
        }
      }

      els.btnShelf.addEventListener("click", openShelf);
      els.btnShelfClose.addEventListener("click", closeShelf);
      els.shelf.addEventListener("click", (e) => {
        if (e.target === els.shelf) closeShelf();
      });

      els.btnPrev.addEventListener("click", () => goTo(pageNum - 1));
      els.btnNext.addEventListener("click", () => goTo(pageNum + 1));
      els.pageInput.addEventListener("change", () => {
        goTo(parseInt(els.pageInput.value, 10) || 1);
      });

      els.btnZoomIn.addEventListener("click", () => {
        scale = Math.min(3, Math.round((scale + 0.15) * 100) / 100);
        renderPage(pageNum);
      });
      els.btnZoomOut.addEventListener("click", () => {
        scale = Math.max(0.5, Math.round((scale - 0.15) * 100) / 100);
        renderPage(pageNum);
      });

      els.btnFs.addEventListener("click", toggleFullscreen);

      // 点画面中间：沉浸模式（藏栏）；点左右：翻页
      els.stage.addEventListener("click", (e) => {
        if (!pdfDoc || e.target.closest(".loading")) return;
        const rect = els.stage.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        if (x < 0.25) goTo(pageNum - 1);
        else if (x > 0.75) goTo(pageNum + 1);
        else document.body.classList.toggle("immersive");
      });

      els.stage.addEventListener("dblclick", (e) => {
        e.preventDefault();
        toggleFullscreen();
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "PageUp") {
          e.preventDefault();
          goTo(pageNum - 1);
        } else if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
          e.preventDefault();
          goTo(pageNum + 1);
        } else if (e.key === "Escape") {
          closeShelf();
          document.body.classList.remove("immersive");
        } else if (e.key === "f" || e.key === "F") {
          toggleFullscreen();
        }
      });

      let touchX = 0;
      let touchY = 0;
      els.stage.addEventListener(
        "touchstart",
        (e) => {
          if (!e.touches[0]) return;
          touchX = e.touches[0].clientX;
          touchY = e.touches[0].clientY;
        },
        { passive: true }
      );
      els.stage.addEventListener(
        "touchend",
        (e) => {
          if (!e.changedTouches[0] || !pdfDoc) return;
          const dx = e.changedTouches[0].clientX - touchX;
          const dy = e.changedTouches[0].clientY - touchY;
          if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy)) return;
          if (dx < 0) goTo(pageNum + 1);
          else goTo(pageNum - 1);
        },
        { passive: true }
      );

      window.addEventListener("resize", () => {
        if (pdfDoc) renderPage(pageNum);
      });

      const params = new URLSearchParams(location.search);
      const fileParam = params.get("file");
      if (fileParam) {
        const hit =
          BOOKS.find((b) => b.file === fileParam) || {
            file: fileParam,
            title: fileParam.replace(/\.pdf$/i, ""),
            sub: fileParam,
          };
        loadBook(hit);
      } else {
        setTimeout(openShelf, 180);
      }
    </script>
  </body>
</html>
