<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>书架</title>
    <style>
      :root {
        --bg: #0a0a0c;
        --bg2: #121218;
        --panel: #16161c;
        --gold: #ffd700;
        --gold-dim: rgba(255, 215, 0, 0.55);
        --text: #e8e4d8;
        --muted: rgba(232, 228, 216, 0.55);
        --border: rgba(255, 215, 0, 0.28);
        --danger: #ff6b6b;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Noto Sans SC", system-ui, sans-serif;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      /* ===== 顶栏 ===== */
      .topbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: max(8px, env(safe-area-inset-top)) 10px 8px;
        background: linear-gradient(180deg, #1a1a22 0%, #0e0e12 100%);
        border-bottom: 1px solid var(--border);
        z-index: 20;
      }

      .topbar .brand {
        font-size: 13px;
        font-weight: 700;
        color: var(--gold);
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      .topbar .title {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        color: var(--text);
        opacity: 0.9;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
      }

      .btn {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255, 215, 0, 0.06);
        color: var(--gold);
        border-radius: 8px;
        min-width: 36px;
        height: 34px;
        padding: 0 10px;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: inherit;
        transition: background 0.15s, transform 0.1s, opacity 0.15s;
      }
      .btn:active {
        transform: scale(0.94);
        background: rgba(255, 215, 0, 0.14);
      }
      .btn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .btn.primary {
        background: linear-gradient(180deg, #3a2e10, #1a1408);
        border-color: var(--gold-dim);
        font-weight: 700;
        font-size: 12px;
      }

      /* ===== 主阅读区 ===== */
      .stage {
        flex: 1;
        min-height: 0;
        position: relative;
        background: #050506;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        touch-action: none;
      }

      .stage.grabbing {
        cursor: grabbing;
      }

      #viewer {
        max-width: none;
        max-height: none;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55);
        background: #111;
        transform-origin: 0 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
        touch-action: none;
      }

      .hint {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--muted);
        font-size: 14px;
        pointer-events: none;
        padding: 24px;
        text-align: center;
      }
      .hint strong {
        color: var(--gold);
        font-size: 16px;
      }

      /* ===== 底栏 ===== */
      .bottombar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px 10px max(10px, env(safe-area-inset-bottom));
        background: linear-gradient(0deg, #1a1a22 0%, #0e0e12 100%);
        border-top: 1px solid var(--border);
        z-index: 20;
      }

      .page-input {
        width: 52px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0c0c10;
        color: var(--gold);
        text-align: center;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        font-family: inherit;
      }
      .page-total {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        min-width: 36px;
      }

      /* ===== 加载遮罩 ===== */
      .loading {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(5, 5, 8, 0.88);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      .loading.show {
        display: flex;
      }
      .loading-label {
        font-size: 13px;
        color: var(--text);
      }
      .progress-track {
        width: min(70vw, 280px);
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 215, 0, 0.1);
        border: 1px solid var(--border);
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, #c9971f, #ffd700 55%, #fff2b8);
        box-shadow: 0 0 12px rgba(255, 215, 0, 0.35);
        transition: width 0.12s linear;
      }
      .progress-pct {
        font-size: 14px;
        font-weight: 700;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
      }

      /* ===== 书架抽屉 ===== */
      .shelf {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: rgba(0, 0, 0, 0.72);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }
      .shelf.show {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      .shelf-panel {
        width: min(100%, 420px);
        max-height: min(78vh, 560px);
        overflow: auto;
        background: linear-gradient(180deg, #1c1c24 0%, #101016 100%);
        border: 1px solid var(--border);
        border-radius: 16px 16px 0 0;
        padding: 14px 14px max(16px, env(safe-area-inset-bottom));
        box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.5);
        transform: translateY(24px);
        transition: transform 0.28s ease;
      }
      .shelf.show .shelf-panel {
        transform: translateY(0);
      }
      .shelf-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        color: var(--gold);
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.5px;
      }
      .book-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .book-item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid rgba(255, 215, 0, 0.22);
        background: rgba(255, 215, 0, 0.04);
        color: var(--text);
        text-align: left;
        cursor: pointer;
        font-family: inherit;
      }
      .book-item:active {
        background: rgba(255, 215, 0, 0.1);
        border-color: var(--gold-dim);
      }
      .book-item.missing {
        opacity: 0.4;
        cursor: default;
      }
      .book-item .ico {
        font-size: 22px;
      }
      .book-item .meta {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .book-item .t {
        font-size: 13px;
        font-weight: 700;
        color: var(--gold);
      }
      .book-item .s {
        font-size: 11px;
        color: var(--muted);
      }
      .scanning,
      .empty {
        text-align: center;
        padding: 28px 8px;
        color: var(--muted);
        font-size: 13px;
      }

      /* ===== 全屏阅读 ===== */
      :fullscreen,
      :-webkit-full-screen {
        width: 100%;
        height: 100%;
      }

      :fullscreen body,
      :-webkit-full-screen body {
        width: 100%;
        height: 100%;
      }

      :fullscreen .topbar,
      :-webkit-full-screen .topbar,
      body.fullscreen-mode .topbar {
        display: none;
      }

      :fullscreen .bottombar,
      :-webkit-full-screen .bottombar,
      body.fullscreen-mode .bottombar {
        display: none;
      }

      :fullscreen .stage,
      :-webkit-full-screen .stage,
      body.fullscreen-mode .stage {
        width: 100vw;
        height: 100dvh;
        min-height: 100dvh;
        flex: 1 1 auto;
        touch-action: none;
      }

      :fullscreen #viewer,
      :-webkit-full-screen #viewer,
      body.fullscreen-mode #viewer {
        max-width: none;
        max-height: none;
      }

      @media (min-width: 720px) {
        .shelf {
          align-items: center;
        }
        .shelf-panel {
          border-radius: 16px;
          transform: scale(0.96);
        }
        .shelf.show .shelf-panel {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <button type="button" class="btn primary" id="btn-shelf" title="书架">
        📚 书架
      </button>
      <div class="title" id="doc-title"></div>
      <button type="button" class="btn" id="btn-zoom-out" title="缩小">−</button>
      <button type="button" class="btn" id="btn-zoom-in" title="放大">+</button>
      <button type="button" class="btn" id="btn-fs" title="全屏">⛶</button>
    </header>

    <main class="stage" id="stage">
      <canvas id="viewer" hidden></canvas>
      <div class="hint" id="hint" hidden></div>
      <div class="mobile-reading-hud" id="mobile-reading-hud" aria-hidden="true">
        <button class="mini-btn" id="mobile-prev" type="button" aria-label="上一页">‹</button>
        <span class="mini-page" id="mobile-page">1 / —</span>
        <button class="mini-btn" id="mobile-next" type="button" aria-label="下一页">›</button>
        <button class="mini-btn" id="mobile-reset" type="button" aria-label="恢复适合屏幕">↺</button>
      </div>
      <div class="loading" id="loading" aria-live="polite">
        <div class="loading-label" id="loading-label">正在加载…</div>
        <div class="progress-track">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="progress-pct" id="progress-pct">0%</div>
      </div>
    </main>

    <footer class="bottombar">
      <button type="button" class="btn" id="btn-prev" title="上一页" disabled>
        ‹ 上一页
      </button>
      <input
        class="page-input"
        id="page-input"
        type="number"
        min="1"
        value="1"
        inputmode="numeric"
        aria-label="页码"
        disabled
      />
      <span class="page-total" id="page-total">/ —</span>
      <button type="button" class="btn" id="btn-next" title="下一页" disabled>
        下一页 ›
      </button>
    </footer>

    <div class="shelf" id="shelf" aria-hidden="true">
      <div class="shelf-panel" role="dialog" aria-labelledby="shelf-title">
        <div class="shelf-head">
          <span id="shelf-title">📚 选择书籍</span>
          <button type="button" class="btn" id="btn-shelf-close" aria-label="关闭">
            ✕
          </button>
        </div>
        <ul class="book-list" id="book-list"></ul>
        <div class="empty" id="book-empty" hidden>暂无可用书籍（请把 PDF 放在同目录）</div>
      </div>
    </div>

    <!-- PDF.js -->
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs" type="module"></script>
    <script type="module">
      import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs";
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs";

      const BOOKS = [
        { file: "anne-of-green-gables.pdf", title: "Anne of Green Gables", sub: "绿山墙的安妮" },
        { file: "outlaws_of_the_marsh.pdf", title: "Outlaws of the Marsh", sub: "水浒传" },
        { file: "jourwest.pdf", title: "Journey to the West", sub: "西游记" },
        { file: "4.pdf", title: "Book 4", sub: "4.pdf" },
        { file: "5.pdf", title: "Book 5", sub: "5.pdf" },
        { file: "6.pdf", title: "Book 6", sub: "6.pdf" },
        { file: "7.pdf", title: "Book 7", sub: "7.pdf" },
      ];

      // PDF 与阅读器同目录，或通过 ?file= 指定
      function bookUrl(file) {
        // 优先同目录；若部署在子路径 /pdf-reader/，也支持上级目录 ../
        return new URL(file, document.baseURI).href;
      }

      const els = {
        stage: document.getElementById("stage"),
        canvas: document.getElementById("viewer"),
        hint: document.getElementById("hint"),
        loading: document.getElementById("loading"),
        loadingLabel: document.getElementById("loading-label"),
        progressBar: document.getElementById("progress-bar"),
        progressPct: document.getElementById("progress-pct"),
        docTitle: document.getElementById("doc-title"),
        pageInput: document.getElementById("page-input"),
        pageTotal: document.getElementById("page-total"),
        btnPrev: document.getElementById("btn-prev"),
        btnNext: document.getElementById("btn-next"),
        btnZoomIn: document.getElementById("btn-zoom-in"),
        btnZoomOut: document.getElementById("btn-zoom-out"),
        btnFs: document.getElementById("btn-fs"),
        mobileHud: document.getElementById("mobile-reading-hud"),
        mobilePage: document.getElementById("mobile-page"),
        mobilePrev: document.getElementById("mobile-prev"),
        mobileNext: document.getElementById("mobile-next"),
        mobileReset: document.getElementById("mobile-reset"),
        btnShelf: document.getElementById("btn-shelf"),
        btnShelfClose: document.getElementById("btn-shelf-close"),
        shelf: document.getElementById("shelf"),
        bookList: document.getElementById("book-list"),
        bookEmpty: document.getElementById("book-empty"),
      };

      let pdfDoc = null;
      let pageNum = 1;
      let scale = 1;
      let rendering = false;
      let pendingPage = null;
      let currentBook = null;
      let availableCache = null;

      // 阅读缩放/拖动状态
      let viewScale = 1;
      let viewX = 0;
      let viewY = 0;
      let baseCanvasW = 0;
      let baseCanvasH = 0;
      let panX = 0;
      let panY = 0;
      let lastPanX = 0;
      let lastPanY = 0;
      let isPanning = false;
      let pinchStartDistance = 0;
      let pinchStartScale = 1;
      let pinchStartCenter = null;
      let pinchLastScale = 1;
      let gestureMoved = false;
      let tapSuppressUntil = 0;
      let hudTimer = null;
      let continuousMode = true;

      // 手势状态：双指缩放
      let pinchStartDistance = 0;
      let pinchStartScale = 1;
      let isPinching = false;

      function clampScale(value) {
        return Math.max(0.5, Math.min(4, value));
      }

      function touchDistance(t1, t2) {
        const dx = t2.clientX - t1.clientX;
        const dy = t2.clientY - t1.clientY;
        return Math.hypot(dx, dy);
      }

      function storageKey(suffix) {
        return "tp_pdf_" + suffix + "_" + (currentBook && currentBook.file);
      }

      function saveReadingState() {
        if (!currentBook) return;
        try {
          localStorage.setItem(storageKey("page"), String(pageNum));
          localStorage.setItem(storageKey("scale"), String(viewScale));
          localStorage.setItem(storageKey("x"), String(viewX));
          localStorage.setItem(storageKey("y"), String(viewY));
        } catch (e) {}
      }

      function readReadingState() {
        const state = { page: 1, scale: 1, x: 0, y: 0 };
        if (!currentBook) return state;
        try {
          const p = parseInt(localStorage.getItem(storageKey("page")) || "1", 10);
          const s = parseFloat(localStorage.getItem(storageKey("scale")) || "1");
          const x = parseFloat(localStorage.getItem(storageKey("x")) || "0");
          const y = parseFloat(localStorage.getItem(storageKey("y")) || "0");
          if (Number.isFinite(p) && p >= 1) state.page = p;
          if (Number.isFinite(s)) state.scale = clamp(s, 1, 4);
          if (Number.isFinite(x)) state.x = x;
          if (Number.isFinite(y)) state.y = y;
        } catch (e) {}
        return state;
      }

      function showReadingHud() {
        if (!els.mobileHud) return;
        els.mobileHud.classList.add("show");
        els.mobileHud.setAttribute("aria-hidden", "false");
        clearTimeout(hudTimer);
        hudTimer = setTimeout(() => {
          els.mobileHud.classList.remove("show");
          els.mobileHud.setAttribute("aria-hidden", "true");
        }, 1800);
      }

      function updateReadingHud() {
        if (!els.mobilePage) return;
        els.mobilePage.textContent =
          `${pageNum} / ${pdfDoc ? pdfDoc.numPages : "—"}`;
        els.stage.classList.add("mobile-reading");
      }

      function setProgress(p) {
        p = Math.max(0, Math.min(100, p | 0));
        els.progressBar.style.width = p + "%";
        els.progressPct.textContent = p + "%";
      }

      function showLoading(label) {
        els.loading.classList.add("show");
        els.loadingLabel.textContent = label || "正在加载…";
        setProgress(0);
      }

      function hideLoading() {
        els.loading.classList.remove("show");
      }

      function updateNav() {
        const n = pdfDoc ? pdfDoc.numPages : 0;
        els.pageTotal.textContent = n ? "/ " + n : "/ —";
        els.pageInput.value = pageNum;
        els.pageInput.max = n || 1;
        els.pageInput.disabled = !pdfDoc;
        els.btnPrev.disabled = !pdfDoc || pageNum <= 1;
        els.btnNext.disabled = !pdfDoc || pageNum >= n;
        updateReadingHud();
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function applyViewTransform() {
        const canvas = els.canvas;
        if (canvas.hidden) return;

        canvas.style.transform =
          `translate3d(${viewX}px, ${viewY}px, 0) scale(${viewScale})`;

        els.stage.classList.toggle("reading-zoomed", viewScale > 1.01);
        saveReadingState();
      }

      function resetView() {
        viewScale = 1;
        viewX = 0;
        viewY = 0;
        applyViewTransform();
      }

      function restoreSavedView() {
        const saved = readReadingState();
        viewScale = saved.scale;
        viewX = saved.x;
        viewY = saved.y;
        fitPanBounds();
        applyViewTransform();
      }

      function fitPanBounds() {
        const stageW = els.stage.clientWidth;
        const stageH = els.stage.clientHeight;
        const w = baseCanvasW * viewScale;
        const h = baseCanvasH * viewScale;

        if (w <= stageW) {
          viewX = (stageW - w) / 2;
        } else {
          const minX = stageW - w;
          viewX = clamp(viewX, minX, 0);
        }

        if (h <= stageH) {
          viewY = (stageH - h) / 2;
        } else {
          const minY = stageH - h;
          viewY = clamp(viewY, minY, 0);
        }
      }

      function setViewScale(nextScale, anchorX, anchorY) {
        const oldScale = viewScale;
        const newScale = clamp(nextScale, 1, 4);
        if (Math.abs(newScale - oldScale) < 0.001) return;

        // 保持手指/鼠标锚点下的内容位置不跳动
        const localX = (anchorX - viewX) / oldScale;
        const localY = (anchorY - viewY) / oldScale;
        viewScale = newScale;
        viewX = anchorX - localX * newScale;
        viewY = anchorY - localY * newScale;

        fitPanBounds();
        applyViewTransform();
      }

      function stagePoint(clientX, clientY) {
        const r = els.stage.getBoundingClientRect();
        return { x: clientX - r.left, y: clientY - r.top };
      }

      function touchDistance(a, b) {
        return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
      }

      function touchCenter(a, b) {
        const r = els.stage.getBoundingClientRect();
        return {
          x: (a.clientX + b.clientX) / 2 - r.left,
          y: (a.clientY + b.clientY) / 2 - r.top
        };
      }

      function resetReadingViewport() {
        resetView();
      }

      async function renderPage(num) {
        if (!pdfDoc) return;
        if (rendering) {
          pendingPage = num;
          return;
        }
        rendering = true;
        try {
          const page = await pdfDoc.getPage(num);
          const base = page.getViewport({ scale: 1 });
          const stageW = els.stage.clientWidth - 16;
          const stageH = els.stage.clientHeight - 16;
          const fit = Math.min(stageW / base.width, stageH / base.height);
          const viewport = page.getViewport({ scale: fit * scale });

          const canvas = els.canvas;
          const ctx = canvas.getContext("2d", { alpha: false });
          const outputScale = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.floor(viewport.width * outputScale);
          canvas.height = Math.floor(viewport.height * outputScale);
          canvas.style.width = Math.floor(viewport.width) + "px";
          canvas.style.height = Math.floor(viewport.height) + "px";
          canvas.hidden = false;

          baseCanvasW = Math.floor(viewport.width);
          baseCanvasH = Math.floor(viewport.height);
          resetReadingViewport();
          els.hint.hidden = true;

          const transform =
            outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

          // 暗色：先铺底，再渲染页面
          ctx.fillStyle = "#111111";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          await page.render({
            canvasContext: ctx,
            viewport,
            transform,
          }).promise;

          pageNum = num;
          updateNav();
          try {
            localStorage.setItem(
              "tp_pdf_pos_" + (currentBook && currentBook.file),
              String(pageNum)
            );
          } catch (e) {}
        } catch (err) {
          console.error(err);
          els.loadingLabel.textContent = "渲染失败";
        } finally {
          rendering = false;
          if (pendingPage !== null && pendingPage !== pageNum) {
            const p = pendingPage;
            pendingPage = null;
            renderPage(p);
          } else {
            pendingPage = null;
          }
        }
      }

      function goTo(num) {
        if (!pdfDoc) return;
        num = Math.max(1, Math.min(pdfDoc.numPages, num | 0));
        if (num === pageNum && !rendering) {
          renderPage(num);
          return;
        }
        // 翻到新页时回到适合屏幕，避免把上一页的局部缩放带到下一页。
        viewScale = 1;
        viewX = 0;
        viewY = 0;
        renderPage(num);
        showReadingHud();
      }

      async function loadBook(book) {
        currentBook = book;
        els.docTitle.textContent = book.title;
        showLoading("正在加载「" + book.title + "」…");
        closeShelf();

        // 销毁旧文档
        if (pdfDoc) {
          try {
            await pdfDoc.destroy();
          } catch (e) {}
          pdfDoc = null;
        }

        const url = bookUrl(book.file);

        try {
          // 带进度的下载
          const data = await fetchWithProgress(url, (p) => setProgress(p));
          setProgress(100);
          els.loadingLabel.textContent = "解析中…";

          const loadingTask = pdfjsLib.getDocument({ data });
          pdfDoc = await loadingTask.promise;

          let start = 1;
          try {
            const saved = parseInt(
              localStorage.getItem("tp_pdf_pos_" + book.file) || "1",
              10
            );
            if (saved >= 1 && saved <= pdfDoc.numPages) start = saved;
          } catch (e) {}

          scale = 1;
          hideLoading();
          await renderPage(start);
        } catch (err) {
          console.error(err);
          els.loadingLabel.textContent =
            "加载失败：" + (err && err.message ? err.message : "未知错误");
          setProgress(0);
          setTimeout(hideLoading, 1600);
          els.hint.hidden = false;
          els.canvas.hidden = true;
          els.docTitle.textContent = "";
          pdfDoc = null;
          updateNav();
        }
      }

      function fetchWithProgress(url, onProgress) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("GET", url, true);
          xhr.responseType = "arraybuffer";
          xhr.onprogress = (e) => {
            if (e.lengthComputable && e.total > 0) {
              onProgress(Math.floor((e.loaded / e.total) * 100));
            } else if (e.loaded > 0) {
              onProgress(Math.min(90, 8 + Math.floor(e.loaded / 80000)));
            }
          };
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 400) {
              onProgress(100);
              resolve(new Uint8Array(xhr.response));
            } else {
              reject(new Error("HTTP " + xhr.status));
            }
          };
          xhr.onerror = () => reject(new Error("网络错误"));
          xhr.ontimeout = () => reject(new Error("超时"));
          xhr.send();
        });
      }

      function probe(file) {
        return new Promise((resolve) => {
          const xhr = new XMLHttpRequest();
          xhr.open("HEAD", bookUrl(file), true);
          xhr.timeout = 6000;
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 400) resolve(true);
            else if (xhr.status === 405 || xhr.status === 501) {
              const g = new XMLHttpRequest();
              g.open("GET", bookUrl(file), true);
              g.timeout = 6000;
              g.onprogress = (e) => {
                if (e.loaded > 0) {
                  g.abort();
                  resolve(true);
                }
              };
              g.onload = () => resolve(g.status >= 200 && g.status < 400);
              g.onerror = g.ontimeout = () => resolve(false);
              g.send();
            } else resolve(false);
          };
          xhr.onerror = xhr.ontimeout = () => resolve(false);
          xhr.send();
        });
      }

      async function openShelf() {
        els.shelf.classList.add("show");
        els.shelf.setAttribute("aria-hidden", "false");
        els.bookList.innerHTML =
          '<li class="scanning">正在扫描可用书籍…</li>';
        els.bookEmpty.hidden = true;

        if (!availableCache) {
          const results = await Promise.all(
            BOOKS.map(async (b) => ({ book: b, ok: await probe(b.file) }))
          );
          availableCache = results;
        }

        const okList = availableCache.filter((x) => x.ok).map((x) => x.book);
        const missList = availableCache.filter((x) => !x.ok).map((x) => x.book);

        els.bookList.innerHTML = "";
        if (!okList.length) {
          els.bookEmpty.hidden = false;
        } else {
          okList.forEach((book) => {
            const li = document.createElement("li");
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "book-item";
            btn.innerHTML =
              '<span class="ico">📖</span><span class="meta"><span class="t"></span><span class="s"></span></span>';
            btn.querySelector(".t").textContent = book.title;
            btn.querySelector(".s").textContent = book.sub + " · " + book.file;
            btn.addEventListener("click", () => loadBook(book));
            li.appendChild(btn);
            els.bookList.appendChild(li);
          });
        }
        // 缺书也列出来但禁用，方便知道还缺哪些
        missList.forEach((book) => {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "book-item missing";
          btn.disabled = true;
          btn.innerHTML =
            '<span class="ico">📕</span><span class="meta"><span class="t"></span><span class="s"></span></span>';
          btn.querySelector(".t").textContent = book.title;
          btn.querySelector(".s").textContent = "暂缺 · " + book.file;
          li.appendChild(btn);
          els.bookList.appendChild(li);
        });
      }

      function closeShelf() {
        els.shelf.classList.remove("show");
        els.shelf.setAttribute("aria-hidden", "true");
      }

      // —— 事件 ——
      els.btnShelf.addEventListener("click", openShelf);
      els.btnShelfClose.addEventListener("click", closeShelf);
      els.shelf.addEventListener("click", (e) => {
        if (e.target === els.shelf) closeShelf();
      });

      els.btnPrev.addEventListener("click", () => goTo(pageNum - 1));
      els.btnNext.addEventListener("click", () => goTo(pageNum + 1));
      els.pageInput.addEventListener("change", () => {
        goTo(parseInt(els.pageInput.value, 10) || 1);
      });

      els.btnZoomIn.addEventListener("click", () => {
        scale = clampScale(Math.round((scale + 0.15) * 100) / 100);
        renderPage(pageNum);
      });
      els.btnZoomOut.addEventListener("click", () => {
        scale = clampScale(Math.round((scale - 0.15) * 100) / 100);
        renderPage(pageNum);
      });

      els.btnFs.addEventListener("click", toggleFullscreen);
      els.stage.addEventListener("dblclick", toggleFullscreen);

      function setFullscreenUi(active) {
        document.body.classList.toggle("fullscreen-mode", active);
        els.btnFs.textContent = active ? "⛶" : "⛶";
        els.btnFs.title = active ? "退出全屏" : "全屏";
        // 全屏后重新计算 fit，让 PDF 尽可能铺满整个屏幕。
        if (pdfDoc) {
          requestAnimationFrame(() => renderPage(pageNum));
        }
      }

      async function toggleFullscreen() {
        const isNativeFullscreen =
          !!(document.fullscreenElement || document.webkitFullscreenElement);

        if (!isNativeFullscreen && !document.body.classList.contains("fullscreen-mode")) {
          const root = document.documentElement;
          const req = root.requestFullscreen || root.webkitRequestFullscreen;

          if (req) {
            try {
              await req.call(root);
              setFullscreenUi(true);
              return;
            } catch (e) {
              console.warn("原生全屏不可用，切换到页面全屏模式", e);
            }
          }

          // 某些手机浏览器不提供 requestFullscreen，使用 CSS 全屏兜底。
          setFullscreenUi(true);
        } else {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (isNativeFullscreen && exit) {
            try {
              await exit.call(document);
            } catch (e) {
              console.warn("退出原生全屏失败", e);
            }
          }
          setFullscreenUi(false);
        }
      }

      function syncFullscreenState() {
        const active =
          !!(document.fullscreenElement || document.webkitFullscreenElement) ||
          document.body.classList.contains("fullscreen-mode");
        setFullscreenUi(active);
      }

      document.addEventListener("fullscreenchange", syncFullscreenState);
      document.addEventListener("webkitfullscreenchange", syncFullscreenState);

      // 手机连续阅读快捷控制
      els.mobilePrev?.addEventListener("click", () => {
        goTo(pageNum - 1);
        showReadingHud();
      });
      els.mobileNext?.addEventListener("click", () => {
        goTo(pageNum + 1);
        showReadingHud();
      });
      els.mobileReset?.addEventListener("click", () => {
        resetView();
        showReadingHud();
      });
      els.stage.addEventListener("touchstart", showReadingHud, { passive: true });

      // 键盘
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "PageUp") {
          e.preventDefault();
          goTo(pageNum - 1);
        } else if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
          e.preventDefault();
          goTo(pageNum + 1);
        } else if (e.key === "Escape") {
          closeShelf();
        } else if (e.key === "f" || e.key === "F") {
          toggleFullscreen();
        }
      });

      // ===== 手机阅读手势 =====
      // 1 指：正常状态左右滑动翻页；放大后拖动页面
      // 2 指：捏合缩放，并以两指中心为缩放锚点
      els.stage.addEventListener("touchstart", (e) => {
        if (!pdfDoc || e.target.closest(".loading")) return;

        if (e.touches.length >= 2) {
          e.preventDefault();
          pinchStartDistance = touchDistance(e.touches[0], e.touches[1]);
          pinchStartScale = viewScale;
          pinchStartCenter = touchCenter(e.touches[0], e.touches[1]);
          pinchLastScale = viewScale;
          gestureMoved = true;
          tapSuppressUntil = Date.now() + 350;
          isPanning = false;
          els.stage.classList.remove("grabbing");
          return;
        }

        if (e.touches.length === 1) {
          const p = stagePoint(e.touches[0].clientX, e.touches[0].clientY);
          panX = p.x;
          panY = p.y;
          lastPanX = viewX;
          lastPanY = viewY;
          isPanning = viewScale > 1.01;
        }
      }, { passive: false });

      els.stage.addEventListener("touchmove", (e) => {
        if (!pdfDoc) return;

        if (e.touches.length >= 2 && pinchStartDistance > 0) {
          e.preventDefault();
          const distance = touchDistance(e.touches[0], e.touches[1]);
          const center = touchCenter(e.touches[0], e.touches[1]);
          const ratio = distance / pinchStartDistance;
          const next = pinchStartScale * ratio;

          setViewScale(next, center.x, center.y);
          if (Math.abs(viewScale - pinchLastScale) > 0.01) {
            showReadingHud();
            pinchLastScale = viewScale;
          }

          // 两指中心移动时同步平移，阅读时更自然
          if (pinchStartCenter) {
            viewX += center.x - pinchStartCenter.x;
            viewY += center.y - pinchStartCenter.y;
            fitPanBounds();
            applyViewTransform();
          }
          pinchStartCenter = center;
          return;
        }

        if (e.touches.length === 1 && viewScale > 1.01) {
          e.preventDefault();
          const p = stagePoint(e.touches[0].clientX, e.touches[0].clientY);
          viewX = lastPanX + (p.x - panX);
          viewY = lastPanY + (p.y - panY);
          fitPanBounds();
          applyViewTransform();
          isPanning = true;
          gestureMoved = true;
          tapSuppressUntil = Date.now() + 350;
          showReadingHud();
        }
      }, { passive: false });

      els.stage.addEventListener("touchend", (e) => {
        if (!pdfDoc) return;

        if (e.touches.length < 2) {
          pinchStartDistance = 0;
          pinchStartCenter = null;
        }

        // 放大状态下单指结束不翻页，避免拖动误翻页
        if (viewScale > 1.01) {
          isPanning = false;
          els.stage.classList.remove("grabbing");
          return;
        }

        if (e.changedTouches.length !== 1) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - panX;
        const dy = t.clientY - panY;

        if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy)) return;
        if (dx < 0) goTo(pageNum + 1);
        else goTo(pageNum - 1);
      }, { passive: false });

      els.stage.addEventListener("touchcancel", () => {
        pinchStartDistance = 0;
        pinchStartCenter = null;
        isPanning = false;
        els.stage.classList.remove("grabbing");
      }, { passive: true });

      // 桌面端鼠标拖动（放大后）
      els.stage.addEventListener("mousedown", (e) => {
        if (!pdfDoc || viewScale <= 1.01 || e.button !== 0) return;
        panX = e.clientX;
        panY = e.clientY;
        lastPanX = viewX;
        lastPanY = viewY;
        isPanning = true;
        els.stage.classList.add("grabbing");
      });

      window.addEventListener("mousemove", (e) => {
        if (!isPanning || viewScale <= 1.01) return;
        viewX = lastPanX + (e.clientX - panX);
        viewY = lastPanY + (e.clientY - panY);
        fitPanBounds();
        applyViewTransform();
      });

      window.addEventListener("mouseup", () => {
        isPanning = false;
        els.stage.classList.remove("grabbing");
      });

      // 鼠标滚轮缩放，方便电脑阅读
      els.stage.addEventListener("wheel", (e) => {
        if (!pdfDoc || (!e.ctrlKey && !e.metaKey)) return;
        e.preventDefault();
        const p = stagePoint(e.clientX, e.clientY);
        setViewScale(viewScale * (e.deltaY < 0 ? 1.12 : 0.89), p.x, p.y);
      }, { passive: false });

      // 点击左/右半屏翻页
      els.stage.addEventListener("click", (e) => {
        if (!pdfDoc || e.target.closest(".loading") || viewScale > 1.01) return;
        if (Date.now() < tapSuppressUntil) return;
        const rect = els.stage.getBoundingClientRect();
        const x = e.clientX - rect.left;
        if (x < rect.width * 0.28) goTo(pageNum - 1);
        else if (x > rect.width * 0.72) goTo(pageNum + 1);
      });

      window.addEventListener("resize", () => {
        if (pdfDoc) renderPage(pageNum);
      });

      window.addEventListener("beforeunload", saveReadingState);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) saveReadingState();
      });

      // ?file=xxx.pdf 直接打开；否则打开书架
      const params = new URLSearchParams(location.search);
      const fileParam = params.get("file");
      if (fileParam) {
        const hit =
          BOOKS.find((b) => b.file === fileParam) || {
            file: fileParam,
            title: fileParam.replace(/\.pdf$/i, ""),
            sub: fileParam,
          };
        loadBook(hit);
      } else {
        // 首次进入：稍等再弹书架，避免闪
        setTimeout(openShelf, 200);
      }
    </script>
  </body>
</html>
