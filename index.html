<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>书架</title>
    <style>
      :root {
        --bg: #0a0a0c;
        --bg2: #121218;
        --panel: #16161c;
        --gold: #ffd700;
        --gold-dim: rgba(255, 215, 0, 0.55);
        --text: #e8e4d8;
        --muted: rgba(232, 228, 216, 0.55);
        --border: rgba(255, 215, 0, 0.28);
        --danger: #ff6b6b;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Noto Sans SC", system-ui, sans-serif;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      /* ===== 顶栏 ===== */
      .topbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: max(8px, env(safe-area-inset-top)) 10px 8px;
        background: linear-gradient(180deg, #1a1a22 0%, #0e0e12 100%);
        border-bottom: 1px solid var(--border);
        z-index: 20;
      }

      .topbar .title {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        color: var(--text);
        opacity: 0.9;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
      }

      .btn {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255, 215, 0, 0.06);
        color: var(--gold);
        border-radius: 8px;
        min-width: 36px;
        height: 34px;
        padding: 0 10px;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: inherit;
        transition: background 0.15s, transform 0.1s, opacity 0.15s;
      }
      .btn:active {
        transform: scale(0.94);
        background: rgba(255, 215, 0, 0.14);
      }
      .btn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .btn.primary {
        background: linear-gradient(180deg, #3a2e10, #1a1408);
        border-color: var(--gold-dim);
        font-weight: 700;
        font-size: 12px;
      }

      /* ===== 主阅读区 ===== */
      .stage {
        flex: 1;
        min-height: 0;
        position: relative;
        background: #050506;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        touch-action: none;
      }
      .stage.grabbing {
        cursor: grabbing;
      }

      /* page-wrap 承载缩放/平移；canvas 为其子元素，始终对齐 */
      #page-wrap {
        position: relative;
        transform-origin: 0 0;
      }

      #viewer {
        display: block;
        max-width: none;
        max-height: none;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55);
        background: #111;
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
        touch-action: none;
      }

      .hint {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--muted);
        font-size: 14px;
        pointer-events: none;
        padding: 24px;
        text-align: center;
      }
      .hint strong {
        color: var(--gold);
        font-size: 16px;
      }

      /* ===== 底栏 ===== */
      .bottombar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px 10px max(10px, env(safe-area-inset-bottom));
        background: linear-gradient(0deg, #1a1a22 0%, #0e0e12 100%);
        border-top: 1px solid var(--border);
        z-index: 20;
      }

      .page-input {
        width: 52px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0c0c10;
        color: var(--gold);
        text-align: center;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        font-family: inherit;
      }
      .page-total {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        min-width: 36px;
      }

      /* ===== 加载遮罩 ===== */
      .loading {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(5, 5, 8, 0.88);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      .loading.show {
        display: flex;
      }
      .loading-label {
        font-size: 13px;
        color: var(--text);
      }
      .progress-track {
        width: min(70vw, 280px);
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 215, 0, 0.1);
        border: 1px solid var(--border);
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, #c9971f, #ffd700 55%, #fff2b8);
        box-shadow: 0 0 12px rgba(255, 215, 0, 0.35);
        transition: width 0.12s linear;
      }
      .progress-pct {
        font-size: 14px;
        font-weight: 700;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
      }

      /* ===== 书架抽屉 ===== */
      .shelf {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: rgba(0, 0, 0, 0.72);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }
      .shelf.show {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      .shelf-panel {
        width: min(100%, 420px);
        max-height: min(78vh, 560px);
        overflow: auto;
        background: linear-gradient(180deg, #1c1c24 0%, #101016 100%);
        border: 1px solid var(--border);
        border-radius: 16px 16px 0 0;
        padding: 14px 14px max(16px, env(safe-area-inset-bottom));
        box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.5);
        transform: translateY(24px);
        transition: transform 0.28s ease;
      }
      .shelf.show .shelf-panel {
        transform: translateY(0);
      }
      .shelf-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        color: var(--gold);
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.5px;
      }

      /* 书架 / 禁书架 切换 */
      .shelf-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      .shelf-tab {
        flex: 1;
        appearance: none;
        border: 1px solid rgba(255, 215, 0, 0.22);
        background: rgba(255, 215, 0, 0.04);
        color: var(--muted);
        border-radius: 10px;
        height: 34px;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }
      .shelf-tab.active {
        background: rgba(255, 215, 0, 0.12);
        border-color: var(--gold-dim);
        color: var(--gold);
        font-weight: 700;
      }
      .shelf-tab:active {
        transform: scale(0.97);
      }

      /* 禁书架密码门 */
      .lock-gate {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 28px 12px 16px;
        text-align: center;
      }
      .lock-gate.show {
        display: flex;
      }
      .lock-gate .lock-ico {
        font-size: 36px;
        line-height: 1;
      }
      .lock-gate .lock-title {
        color: var(--gold);
        font-weight: 700;
        font-size: 15px;
      }
      .lock-gate .lock-hint {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .lock-gate .lock-row {
        display: flex;
        gap: 8px;
        width: 100%;
        max-width: 260px;
        margin-top: 4px;
      }
      .lock-gate input {
        flex: 1;
        min-width: 0;
        height: 36px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0c0c10;
        color: var(--gold);
        text-align: center;
        font-size: 16px;
        letter-spacing: 4px;
        font-family: inherit;
      }
      .lock-gate input:focus {
        outline: none;
        border-color: var(--gold-dim);
      }
      .lock-gate .lock-err {
        color: var(--danger);
        font-size: 12px;
        min-height: 18px;
      }

      .book-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .book-item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid rgba(255, 215, 0, 0.22);
        background: rgba(255, 215, 0, 0.04);
        color: var(--text);
        text-align: left;
        cursor: pointer;
        font-family: inherit;
      }
      .book-item:active {
        background: rgba(255, 215, 0, 0.1);
        border-color: var(--gold-dim);
      }
      .book-item.missing {
        opacity: 0.4;
        cursor: default;
      }
      .book-item .ico {
        font-size: 22px;
      }
      .book-item .meta {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .book-item .t {
        font-size: 13px;
        font-weight: 700;
        color: var(--gold);
      }
      .book-item .s {
        font-size: 11px;
        color: var(--muted);
      }
      .scanning,
      .empty {
        text-align: center;
        padding: 28px 8px;
        color: var(--muted);
        font-size: 13px;
      }
      .shelf-foot {
        display: flex;
        justify-content: center;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 215, 0, 0.14);
      }
      .btn-link {
        appearance: none;
        background: none;
        border: none;
        color: var(--muted);
        font-size: 12px;
        font-family: inherit;
        padding: 6px 10px;
        cursor: pointer;
      }
      .btn-link:active {
        color: var(--danger);
      }

      /* ===== 全屏 ===== */
      :fullscreen,
      :-webkit-full-screen {
        width: 100%;
        height: 100%;
      }
      :fullscreen body,
      :-webkit-full-screen body {
        width: 100%;
        height: 100%;
      }
      :fullscreen .topbar,
      :-webkit-full-screen .topbar,
      body.fullscreen-mode .topbar,
      :fullscreen .bottombar,
      :-webkit-full-screen .bottombar,
      body.fullscreen-mode .bottombar {
        display: none;
      }
      :fullscreen .stage,
      :-webkit-full-screen .stage,
      body.fullscreen-mode .stage {
        width: 100vw;
        height: 100dvh;
        min-height: 100dvh;
        flex: 1 1 auto;
        touch-action: none;
      }
      :fullscreen #viewer,
      :-webkit-full-screen #viewer,
      body.fullscreen-mode #viewer {
        max-width: none;
        max-height: none;
      }

      .fs-exit-btn {
        display: none;
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        right: 10px;
        z-index: 25;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: rgba(10, 10, 12, 0.55);
        color: var(--gold);
        font-size: 14px;
        cursor: pointer;
      }
      :fullscreen .fs-exit-btn,
      :-webkit-full-screen .fs-exit-btn,
      body.fullscreen-mode .fs-exit-btn {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @media (min-width: 720px) {
        .shelf {
          align-items: center;
        }
        .shelf-panel {
          border-radius: 16px;
          transform: scale(0.96);
        }
        .shelf.show .shelf-panel {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <button type="button" class="btn primary" id="btn-shelf" title="书架">
        📚 书架
      </button>
      <div class="title" id="doc-title"></div>
      <button type="button" class="btn" id="btn-fs" title="全屏">⛶</button>
    </header>

    <main class="stage" id="stage">
      <div id="page-wrap">
        <canvas id="viewer" hidden></canvas>
      </div>
      <div class="hint" id="hint" hidden></div>
      <button type="button" class="fs-exit-btn" id="btn-fs-exit" title="退出全屏">✕</button>
      <div class="loading" id="loading" aria-live="polite">
        <div class="loading-label" id="loading-label">正在加载…</div>
        <div class="progress-track">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="progress-pct" id="progress-pct">0%</div>
      </div>
    </main>

    <footer class="bottombar">
      <button type="button" class="btn" id="btn-prev" title="上一页" disabled>
        ‹ 上一页
      </button>
      <input
        class="page-input"
        id="page-input"
        type="number"
        min="1"
        value="1"
        inputmode="numeric"
        aria-label="页码"
        disabled
      />
      <span class="page-total" id="page-total">/ —</span>
      <button type="button" class="btn" id="btn-next" title="下一页" disabled>
        下一页 ›
      </button>
    </footer>

    <div class="shelf" id="shelf" aria-hidden="true">
      <div class="shelf-panel" role="dialog" aria-labelledby="shelf-title">
        <div class="shelf-head">
          <span id="shelf-title">📚 选择书籍</span>
          <span style="display: flex; gap: 6px">
            <button type="button" class="btn" id="btn-shelf-refresh" title="重新扫描书目">
              🔄
            </button>
            <button type="button" class="btn" id="btn-shelf-close" aria-label="关闭">
              ✕
            </button>
          </span>
        </div>

        <div class="shelf-tabs" role="tablist">
          <button
            type="button"
            class="shelf-tab active"
            id="tab-normal"
            role="tab"
            aria-selected="true"
          >
            📚 书架
          </button>
          <button
            type="button"
            class="shelf-tab"
            id="tab-restricted"
            role="tab"
            aria-selected="false"
          >
            🔒 禁书架
          </button>
        </div>

        <div class="lock-gate" id="lock-gate">
          <div class="lock-ico">🔒</div>
          <div class="lock-title">禁书架已上锁</div>
          <div class="lock-hint">请输入密码后查看（关闭标签页后需重新验证）</div>
          <div class="lock-row">
            <input
              type="password"
              id="lock-input"
              inputmode="numeric"
              maxlength="16"
              autocomplete="off"
              placeholder="••••"
              aria-label="禁书架密码"
            />
            <button type="button" class="btn primary" id="btn-lock-unlock">解锁</button>
          </div>
          <div class="lock-err" id="lock-err"></div>
        </div>

        <ul class="book-list" id="book-list"></ul>
        <div class="empty" id="book-empty" hidden>暂无可用书籍</div>

        <div class="shelf-foot">
          <button type="button" class="btn-link" id="btn-clear-history">
            🗑 清除阅读记录
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs" type="module"></script>
    <script type="module">
      import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs";
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs";

      /* ============================================================
       * 配置
       * - PDF 文件统一从 BOOKS_BASE 拉取
       * - 书目清单 books.json 与本页面同目录（仅元数据，体积小）
       * - books.json 条目可加 "restricted": true 放入禁书架
       * ============================================================ */
      const BOOKS_BASE = "https://totp99.github.io/source/books/";
      const RESTRICTED_PASSWORD = "1216";
      const SS_RESTRICTED_UNLOCK = "tp_restricted_unlocked";

      const DB_NAME = "tp_reader_db";
      const DB_VERSION = 1;
      const STORE_NAME = "kv";
      const KEY_LAST_BOOK = "last_book";
      const keyBookState = (file) => "book_state:" + file;

      /** 根据文件名拼出远程 PDF 完整 URL（正确处理空格等特殊字符） */
      function bookUrl(file) {
        // 逐段 encode，保留已有路径结构
        const encoded = String(file)
          .split("/")
          .map((seg) => encodeURIComponent(seg))
          .join("/");
        return new URL(encoded, BOOKS_BASE).href;
      }

      /* ============================================================
       * 书目清单
       * ============================================================ */
      let BOOKS = [];
      let booksManifestError = null;

      async function loadBooksManifest() {
        try {
          const res = await fetch(new URL("books.json", document.baseURI).href, {
            cache: "no-store",
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          if (!Array.isArray(data)) throw new Error("books.json 顶层应该是一个数组");
          BOOKS = data
            .filter((b) => b && typeof b.file === "string" && b.file.trim())
            .map((b) => ({
              file: b.file.trim(),
              title:
                (b.title && String(b.title).trim()) ||
                b.file.replace(/\.pdf$/i, ""),
              sub: (b.sub && String(b.sub).trim()) || "",
              restricted: !!b.restricted,
            }));
          booksManifestError = null;
        } catch (e) {
          BOOKS = [];
          booksManifestError = e && e.message ? e.message : "未知错误";
        }
      }

      /* ============================================================
       * IndexedDB（阅读进度 / 最近书籍）
       * ============================================================ */
      let dbPromise = null;

      function idbOpen() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve, reject) => {
          if (!window.indexedDB) {
            reject(new Error("IndexedDB 不可用"));
            return;
          }
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        return dbPromise;
      }

      async function idbGet(key) {
        try {
          const db = await idbOpen();
          return await new Promise((resolve, reject) => {
            const req = db
              .transaction(STORE_NAME, "readonly")
              .objectStore(STORE_NAME)
              .get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          });
        } catch (e) {
          return undefined;
        }
      }

      async function idbSet(key, value) {
        try {
          const db = await idbOpen();
          await new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).put(value, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
          return true;
        } catch (e) {
          return false;
        }
      }

      async function idbClearAll() {
        try {
          const db = await idbOpen();
          await new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).clear();
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
          return true;
        } catch (e) {
          return false;
        }
      }

      /** 一次性把旧版 localStorage 记录迁到 IndexedDB */
      async function migrateFromLocalStorage() {
        const MIGRATED_FLAG = "tp_migrated_v2";
        try {
          if (localStorage.getItem(MIGRATED_FLAG)) return;
          const lastRaw = localStorage.getItem("tp_last_book");
          if (lastRaw) {
            try {
              await idbSet(KEY_LAST_BOOK, JSON.parse(lastRaw));
            } catch (e) {}
          }
          const OLD_PAGE_PREFIX = "tp_pdf_pos_";
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.indexOf(OLD_PAGE_PREFIX) === 0) {
              const file = k.slice(OLD_PAGE_PREFIX.length);
              const page = parseInt(localStorage.getItem(k) || "1", 10);
              await idbSet(keyBookState(file), { page });
            }
          }
          localStorage.setItem(MIGRATED_FLAG, "1");
        } catch (e) {}
      }

      /* ============================================================
       * DOM
       * ============================================================ */
      const els = {
        stage: document.getElementById("stage"),
        pageWrap: document.getElementById("page-wrap"),
        canvas: document.getElementById("viewer"),
        hint: document.getElementById("hint"),
        loading: document.getElementById("loading"),
        loadingLabel: document.getElementById("loading-label"),
        progressBar: document.getElementById("progress-bar"),
        progressPct: document.getElementById("progress-pct"),
        docTitle: document.getElementById("doc-title"),
        pageInput: document.getElementById("page-input"),
        pageTotal: document.getElementById("page-total"),
        btnPrev: document.getElementById("btn-prev"),
        btnNext: document.getElementById("btn-next"),
        btnFs: document.getElementById("btn-fs"),
        btnFsExit: document.getElementById("btn-fs-exit"),
        btnShelf: document.getElementById("btn-shelf"),
        btnShelfClose: document.getElementById("btn-shelf-close"),
        btnShelfRefresh: document.getElementById("btn-shelf-refresh"),
        btnClearHistory: document.getElementById("btn-clear-history"),
        shelf: document.getElementById("shelf"),
        bookList: document.getElementById("book-list"),
        bookEmpty: document.getElementById("book-empty"),
        tabNormal: document.getElementById("tab-normal"),
        tabRestricted: document.getElementById("tab-restricted"),
        lockGate: document.getElementById("lock-gate"),
        lockInput: document.getElementById("lock-input"),
        lockErr: document.getElementById("lock-err"),
        btnLockUnlock: document.getElementById("btn-lock-unlock"),
        shelfTitle: document.getElementById("shelf-title"),
      };

      /* ============================================================
       * 状态
       * ============================================================ */
      let pdfDoc = null;
      let pageNum = 1;
      let rendering = false;
      let pendingPage = null;
      let currentBook = null;
      let availableCache = null;

      // 视图缩放 / 平移
      let viewScale = 1;
      let viewX = 0;
      let viewY = 0;
      let baseCanvasW = 0;
      let baseCanvasH = 0;
      let panX = 0;
      let panY = 0;
      let panClientX = 0;
      let panClientY = 0;
      let lastPanX = 0;
      let lastPanY = 0;
      let isPanning = false;
      let pinchStartDistance = 0;
      let pinchStartScale = 1;
      let pinchStartCenter = null;

      // 书架分区
      let shelfMode = "normal"; // "normal" | "restricted"

      function isRestrictedUnlocked() {
        try {
          return sessionStorage.getItem(SS_RESTRICTED_UNLOCK) === "1";
        } catch (e) {
          return false;
        }
      }
      function setRestrictedUnlocked(ok) {
        try {
          if (ok) sessionStorage.setItem(SS_RESTRICTED_UNLOCK, "1");
          else sessionStorage.removeItem(SS_RESTRICTED_UNLOCK);
        } catch (e) {}
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      /* ============================================================
       * 加载 UI
       * ============================================================ */
      function setProgress(p) {
        p = clamp(p | 0, 0, 100);
        els.progressBar.style.width = p + "%";
        els.progressPct.textContent = p + "%";
      }
      function showLoading(label) {
        els.loading.classList.add("show");
        els.loadingLabel.textContent = label || "正在加载…";
        setProgress(0);
      }
      function hideLoading() {
        els.loading.classList.remove("show");
      }
      function updateNav() {
        const n = pdfDoc ? pdfDoc.numPages : 0;
        els.pageTotal.textContent = n ? "/ " + n : "/ —";
        els.pageInput.value = pageNum;
        els.pageInput.max = n || 1;
        els.pageInput.disabled = !pdfDoc;
        els.btnPrev.disabled = !pdfDoc || pageNum <= 1;
        els.btnNext.disabled = !pdfDoc || pageNum >= n;
      }

      /* ============================================================
       * 视图变换（捏合缩放 / 拖动）
       * ============================================================ */
      function applyViewTransform() {
        if (els.canvas.hidden) return;
        els.pageWrap.style.transform =
          `translate3d(${viewX}px, ${viewY}px, 0) scale(${viewScale})`;
      }

      function resetView() {
        viewScale = 1;
        viewX = 0;
        viewY = 0;
        applyViewTransform();
      }

      function fitPanBounds() {
        const stageW = els.stage.clientWidth;
        const stageH = els.stage.clientHeight;
        const w = baseCanvasW * viewScale;
        const h = baseCanvasH * viewScale;

        if (w <= stageW) viewX = (stageW - w) / 2;
        else viewX = clamp(viewX, stageW - w, 0);

        if (h <= stageH) viewY = (stageH - h) / 2;
        else viewY = clamp(viewY, stageH - h, 0);
      }

      function setViewScale(nextScale, anchorX, anchorY) {
        const oldScale = viewScale;
        const newScale = clamp(nextScale, 1, 4);
        if (Math.abs(newScale - oldScale) < 0.001) return;

        const localX = (anchorX - viewX) / oldScale;
        const localY = (anchorY - viewY) / oldScale;
        viewScale = newScale;
        viewX = anchorX - localX * newScale;
        viewY = anchorY - localY * newScale;
        fitPanBounds();
        applyViewTransform();
      }

      function stagePoint(clientX, clientY) {
        const r = els.stage.getBoundingClientRect();
        return { x: clientX - r.left, y: clientY - r.top };
      }
      function touchDistance(a, b) {
        return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
      }
      function touchCenter(a, b) {
        const r = els.stage.getBoundingClientRect();
        return {
          x: (a.clientX + b.clientX) / 2 - r.left,
          y: (a.clientY + b.clientY) / 2 - r.top,
        };
      }

      /* ============================================================
       * 渲染 / 翻页
       * ============================================================ */
      async function renderPage(num) {
        if (!pdfDoc) return;
        if (rendering) {
          pendingPage = num;
          return;
        }
        rendering = true;
        try {
          const page = await pdfDoc.getPage(num);
          const base = page.getViewport({ scale: 1 });
          const stageW = els.stage.clientWidth - 16;
          const stageH = els.stage.clientHeight - 16;
          const fit = Math.min(stageW / base.width, stageH / base.height);
          const viewport = page.getViewport({ scale: fit });

          const canvas = els.canvas;
          const ctx = canvas.getContext("2d", { alpha: false });
          const outputScale = Math.min(window.devicePixelRatio || 1, 3);
          canvas.width = Math.floor(viewport.width * outputScale);
          canvas.height = Math.floor(viewport.height * outputScale);
          canvas.style.width = Math.floor(viewport.width) + "px";
          canvas.style.height = Math.floor(viewport.height) + "px";
          canvas.hidden = false;

          els.pageWrap.style.width = Math.floor(viewport.width) + "px";
          els.pageWrap.style.height = Math.floor(viewport.height) + "px";

          baseCanvasW = Math.floor(viewport.width);
          baseCanvasH = Math.floor(viewport.height);
          resetView();
          els.hint.hidden = true;

          const transform =
            outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

          ctx.fillStyle = "#111111";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          await page.render({ canvasContext: ctx, viewport, transform }).promise;

          pageNum = num;
          updateNav();
          if (currentBook && currentBook.file) {
            idbSet(keyBookState(currentBook.file), { page: pageNum });
          }
        } catch (err) {
          console.error(err);
          els.loadingLabel.textContent = "渲染失败";
        } finally {
          rendering = false;
          if (pendingPage !== null && pendingPage !== pageNum) {
            const p = pendingPage;
            pendingPage = null;
            renderPage(p);
          } else {
            pendingPage = null;
          }
        }
      }

      function goTo(num) {
        if (!pdfDoc) return;
        num = Math.max(1, Math.min(pdfDoc.numPages, num | 0));
        renderPage(num);
      }

      /* ============================================================
       * 加载书籍
       * ============================================================ */
      async function loadBook(book) {
        // 禁书必须先解锁，防止 URL / 最近阅读绕过
        if (book && book.restricted && !isRestrictedUnlocked()) {
          setTimeout(() => {
            setShelfMode("restricted");
            openShelf();
          }, 50);
          return;
        }

        currentBook = book;
        els.docTitle.textContent = book.title;
        showLoading("正在加载「" + book.title + "」…");
        closeShelf();

        if (pdfDoc) {
          try {
            await pdfDoc.destroy();
          } catch (e) {}
          pdfDoc = null;
        }

        const url = bookUrl(book.file);

        try {
          const data = await fetchWithProgress(url, (p) => setProgress(p));
          setProgress(100);
          els.loadingLabel.textContent = "解析中…";

          const loadingTask = pdfjsLib.getDocument({ data });
          pdfDoc = await loadingTask.promise;

          let start = 1;
          const savedState = await idbGet(keyBookState(book.file));
          if (
            savedState &&
            savedState.page >= 1 &&
            savedState.page <= pdfDoc.numPages
          ) {
            start = savedState.page;
          }

          hideLoading();
          await renderPage(start);

          idbSet(KEY_LAST_BOOK, {
            file: book.file,
            title: book.title,
            sub: book.sub,
            restricted: !!book.restricted,
          });
        } catch (err) {
          console.error(err);
          els.loadingLabel.textContent =
            "加载失败：" + (err && err.message ? err.message : "未知错误");
          setProgress(0);
          setTimeout(hideLoading, 1600);
          els.hint.hidden = false;
          els.canvas.hidden = true;
          els.docTitle.textContent = "";
          pdfDoc = null;
          updateNav();
          setTimeout(openShelf, 300);
        }
      }

      function fetchWithProgress(url, onProgress) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open("GET", url, true);
          xhr.responseType = "arraybuffer";
          xhr.onprogress = (e) => {
            if (e.lengthComputable && e.total > 0) {
              onProgress(Math.floor((e.loaded / e.total) * 100));
            } else if (e.loaded > 0) {
              onProgress(Math.min(90, 8 + Math.floor(e.loaded / 80000)));
            }
          };
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 400) {
              onProgress(100);
              resolve(new Uint8Array(xhr.response));
            } else {
              reject(new Error("HTTP " + xhr.status));
            }
          };
          xhr.onerror = () => reject(new Error("网络错误"));
          xhr.ontimeout = () => reject(new Error("超时"));
          xhr.send();
        });
      }

      /* ============================================================
       * 书架：探测文件 / 分区展示 / 禁书密码
       * ============================================================ */
      function probe(file) {
        return new Promise((resolve) => {
          const xhr = new XMLHttpRequest();
          xhr.open("HEAD", bookUrl(file), true);
          xhr.timeout = 8000;
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 400) resolve(true);
            else if (xhr.status === 405 || xhr.status === 501) {
              // 部分托管不支持 HEAD，退化为 GET 并立刻 abort
              const g = new XMLHttpRequest();
              g.open("GET", bookUrl(file), true);
              g.timeout = 8000;
              g.onprogress = (e) => {
                if (e.loaded > 0) {
                  g.abort();
                  resolve(true);
                }
              };
              g.onload = () => resolve(g.status >= 200 && g.status < 400);
              g.onerror = g.ontimeout = () => resolve(false);
              g.send();
            } else resolve(false);
          };
          xhr.onerror = xhr.ontimeout = () => resolve(false);
          xhr.send();
        });
      }

      async function openShelf() {
        els.shelf.classList.add("show");
        els.shelf.setAttribute("aria-hidden", "false");
        await renderShelfContent();
      }

      function closeShelf() {
        els.shelf.classList.remove("show");
        els.shelf.setAttribute("aria-hidden", "true");
      }

      function setShelfMode(mode) {
        shelfMode = mode === "restricted" ? "restricted" : "normal";
        els.tabNormal.classList.toggle("active", shelfMode === "normal");
        els.tabRestricted.classList.toggle("active", shelfMode === "restricted");
        els.tabNormal.setAttribute(
          "aria-selected",
          shelfMode === "normal" ? "true" : "false"
        );
        els.tabRestricted.setAttribute(
          "aria-selected",
          shelfMode === "restricted" ? "true" : "false"
        );
        els.shelfTitle.textContent =
          shelfMode === "restricted" ? "🔒 禁书架" : "📚 选择书籍";
        renderShelfContent();
      }

      async function renderShelfContent() {
        const needLock = shelfMode === "restricted" && !isRestrictedUnlocked();
        els.lockGate.classList.toggle("show", needLock);
        els.bookList.hidden = needLock;
        els.bookEmpty.hidden = true;

        if (needLock) {
          els.bookList.innerHTML = "";
          els.lockErr.textContent = "";
          els.lockInput.value = "";
          setTimeout(() => {
            try {
              els.lockInput.focus();
            } catch (e) {}
          }, 280);
          return;
        }

        els.bookList.innerHTML =
          '<li class="scanning">正在扫描可用书籍…</li>';

        if (booksManifestError) {
          els.bookList.innerHTML = "";
          els.bookEmpty.hidden = false;
          els.bookEmpty.textContent =
            "书目清单 books.json 加载失败：" +
            booksManifestError +
            "（检查同目录下是否有 books.json）";
          return;
        }

        if (!availableCache) {
          const results = await Promise.all(
            BOOKS.map(async (b) => ({ book: b, ok: await probe(b.file) }))
          );
          availableCache = results;
        }

        const inMode = (b) =>
          shelfMode === "restricted" ? !!b.restricted : !b.restricted;

        const okList = availableCache
          .filter((x) => x.ok && inMode(x.book))
          .map((x) => x.book);
        const missList = availableCache
          .filter((x) => !x.ok && inMode(x.book))
          .map((x) => x.book);

        els.bookList.innerHTML = "";

        if (!okList.length && !missList.length) {
          els.bookEmpty.hidden = false;
          els.bookEmpty.textContent =
            shelfMode === "restricted"
              ? '暂无禁书（在 books.json 中给条目加上 "restricted": true）'
              : "暂无可用书籍";
        } else if (!okList.length) {
          els.bookEmpty.hidden = false;
          els.bookEmpty.textContent =
            shelfMode === "restricted"
              ? "禁书文件暂缺（请确认远程目录中有对应 PDF）"
              : "暂无可用书籍（请确认远程目录中有对应 PDF）";
        }

        okList.forEach((book) => {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "book-item";
          btn.innerHTML =
            '<span class="ico">' +
            (book.restricted ? "🔒" : "📖") +
            '</span><span class="meta"><span class="t"></span><span class="s"></span></span>';
          btn.querySelector(".t").textContent = book.title;
          btn.querySelector(".s").textContent =
            (book.sub ? book.sub + " · " : "") + book.file;
          btn.addEventListener("click", () => loadBook(book));
          li.appendChild(btn);
          els.bookList.appendChild(li);
        });

        missList.forEach((book) => {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "book-item missing";
          btn.disabled = true;
          btn.innerHTML =
            '<span class="ico">📕</span><span class="meta"><span class="t"></span><span class="s"></span></span>';
          btn.querySelector(".t").textContent = book.title;
          btn.querySelector(".s").textContent = "暂缺 · " + book.file;
          li.appendChild(btn);
          els.bookList.appendChild(li);
        });
      }

      function tryUnlockRestricted() {
        const val = (els.lockInput.value || "").trim();
        if (val === RESTRICTED_PASSWORD) {
          setRestrictedUnlocked(true);
          els.lockErr.textContent = "";
          els.lockInput.value = "";
          renderShelfContent();
        } else {
          els.lockErr.textContent = "密码错误，请重试";
          els.lockInput.select();
        }
      }

      /* ============================================================
       * 事件绑定
       * ============================================================ */
      els.btnShelf.addEventListener("click", openShelf);
      els.btnShelfClose.addEventListener("click", closeShelf);
      els.shelf.addEventListener("click", (e) => {
        if (e.target === els.shelf) closeShelf();
      });

      els.tabNormal.addEventListener("click", () => setShelfMode("normal"));
      els.tabRestricted.addEventListener("click", () =>
        setShelfMode("restricted")
      );
      els.btnLockUnlock.addEventListener("click", tryUnlockRestricted);
      els.lockInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          tryUnlockRestricted();
        }
      });

      els.btnShelfRefresh.addEventListener("click", async () => {
        availableCache = null;
        await loadBooksManifest();
        renderShelfContent();
      });

      els.btnClearHistory.addEventListener("click", async () => {
        if (
          !confirm(
            "确定清除所有阅读记录吗？（各本书的页码和最近阅读书籍都会被清空）"
          )
        ) {
          return;
        }
        els.btnClearHistory.disabled = true;
        els.btnClearHistory.textContent = "清除中…";
        await idbClearAll();
        location.reload();
      });

      els.btnPrev.addEventListener("click", () => goTo(pageNum - 1));
      els.btnNext.addEventListener("click", () => goTo(pageNum + 1));
      els.pageInput.addEventListener("change", () => {
        goTo(parseInt(els.pageInput.value, 10) || 1);
      });

      /* ============================================================
       * 全屏
       * ============================================================ */
      els.btnFs.addEventListener("click", toggleFullscreen);
      els.stage.addEventListener("dblclick", toggleFullscreen);
      els.btnFsExit.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleFullscreen();
      });

      function setFullscreenUi(active) {
        document.body.classList.toggle("fullscreen-mode", active);
        els.btnFs.title = active ? "退出全屏" : "全屏";
        if (pdfDoc) requestAnimationFrame(() => renderPage(pageNum));
      }

      async function toggleFullscreen() {
        const isNativeFullscreen = !!(
          document.fullscreenElement || document.webkitFullscreenElement
        );

        if (
          !isNativeFullscreen &&
          !document.body.classList.contains("fullscreen-mode")
        ) {
          const root = document.documentElement;
          const req = root.requestFullscreen || root.webkitRequestFullscreen;
          if (req) {
            try {
              await req.call(root);
              setFullscreenUi(true);
              return;
            } catch (e) {
              console.warn("原生全屏不可用，切换到页面全屏模式", e);
            }
          }
          setFullscreenUi(true);
        } else {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (isNativeFullscreen && exit) {
            try {
              await exit.call(document);
            } catch (e) {
              console.warn("退出原生全屏失败", e);
            }
          }
          setFullscreenUi(false);
        }
      }

      function syncFullscreenState() {
        const active = !!(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.body.classList.contains("fullscreen-mode")
        );
        setFullscreenUi(active);
      }
      document.addEventListener("fullscreenchange", syncFullscreenState);
      document.addEventListener("webkitfullscreenchange", syncFullscreenState);

      /* ============================================================
       * 键盘
       * ============================================================ */
      window.addEventListener("keydown", (e) => {
        const activeTag =
          document.activeElement && document.activeElement.tagName;
        if (activeTag === "INPUT" || activeTag === "TEXTAREA") return;

        if (e.key === "ArrowLeft" || e.key === "PageUp") {
          e.preventDefault();
          goTo(pageNum - 1);
        } else if (
          e.key === "ArrowRight" ||
          e.key === "PageDown" ||
          e.key === " "
        ) {
          e.preventDefault();
          goTo(pageNum + 1);
        } else if (e.key === "Escape") {
          closeShelf();
        } else if (e.key === "f" || e.key === "F") {
          toggleFullscreen();
        }
      });

      /* ============================================================
       * 触屏手势 / 鼠标
       * ============================================================ */
      els.stage.addEventListener(
        "touchstart",
        (e) => {
          if (!pdfDoc || e.target.closest(".loading")) return;

          if (e.touches.length >= 2) {
            e.preventDefault();
            pinchStartDistance = touchDistance(e.touches[0], e.touches[1]);
            pinchStartScale = viewScale;
            pinchStartCenter = touchCenter(e.touches[0], e.touches[1]);
            isPanning = false;
            els.stage.classList.remove("grabbing");
            return;
          }

          if (e.touches.length === 1) {
            const p = stagePoint(e.touches[0].clientX, e.touches[0].clientY);
            panX = p.x;
            panY = p.y;
            // 额外记下 client 坐标，供 touchend 判断左右滑翻页
            panClientX = e.touches[0].clientX;
            panClientY = e.touches[0].clientY;
            lastPanX = viewX;
            lastPanY = viewY;
            isPanning = viewScale > 1.01;
          }
        },
        { passive: false }
      );

      els.stage.addEventListener(
        "touchmove",
        (e) => {
          if (!pdfDoc) return;

          if (e.touches.length >= 2 && pinchStartDistance > 0) {
            e.preventDefault();
            const distance = touchDistance(e.touches[0], e.touches[1]);
            const center = touchCenter(e.touches[0], e.touches[1]);
            setViewScale(
              pinchStartScale * (distance / pinchStartDistance),
              center.x,
              center.y
            );
            if (pinchStartCenter) {
              viewX += center.x - pinchStartCenter.x;
              viewY += center.y - pinchStartCenter.y;
              fitPanBounds();
              applyViewTransform();
            }
            pinchStartCenter = center;
            return;
          }

          if (e.touches.length === 1 && viewScale > 1.01) {
            e.preventDefault();
            const p = stagePoint(e.touches[0].clientX, e.touches[0].clientY);
            viewX = lastPanX + (p.x - panX);
            viewY = lastPanY + (p.y - panY);
            fitPanBounds();
            applyViewTransform();
            isPanning = true;
          }
        },
        { passive: false }
      );

      els.stage.addEventListener(
        "touchend",
        (e) => {
          if (!pdfDoc) return;

          if (e.touches.length < 2) {
            pinchStartDistance = 0;
            pinchStartCenter = null;
          }

          if (viewScale > 1.01) {
            isPanning = false;
            els.stage.classList.remove("grabbing");
            return;
          }

          if (e.changedTouches.length !== 1) return;
          const t = e.changedTouches[0];
          const dx = t.clientX - panClientX;
          const dy = t.clientY - panClientY;
          if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy)) return;
          if (dx < 0) goTo(pageNum + 1);
          else goTo(pageNum - 1);
        },
        { passive: false }
      );

      els.stage.addEventListener(
        "touchcancel",
        () => {
          pinchStartDistance = 0;
          pinchStartCenter = null;
          isPanning = false;
          els.stage.classList.remove("grabbing");
        },
        { passive: true }
      );

      // 桌面拖动（放大后）
      els.stage.addEventListener("mousedown", (e) => {
        if (!pdfDoc || viewScale <= 1.01 || e.button !== 0) return;
        panX = e.clientX;
        panY = e.clientY;
        lastPanX = viewX;
        lastPanY = viewY;
        isPanning = true;
        els.stage.classList.add("grabbing");
      });
      window.addEventListener("mousemove", (e) => {
        if (!isPanning || viewScale <= 1.01) return;
        viewX = lastPanX + (e.clientX - panX);
        viewY = lastPanY + (e.clientY - panY);
        fitPanBounds();
        applyViewTransform();
      });
      window.addEventListener("mouseup", () => {
        isPanning = false;
        els.stage.classList.remove("grabbing");
      });

      // Ctrl/⌘ + 滚轮缩放
      els.stage.addEventListener(
        "wheel",
        (e) => {
          if (!pdfDoc || (!e.ctrlKey && !e.metaKey)) return;
          e.preventDefault();
          const p = stagePoint(e.clientX, e.clientY);
          setViewScale(viewScale * (e.deltaY < 0 ? 1.12 : 0.89), p.x, p.y);
        },
        { passive: false }
      );

      // 单击左右半屏翻页；延迟以区分双击全屏
      let stageClickTimer = null;
      els.stage.addEventListener("click", (e) => {
        if (!pdfDoc || e.target.closest(".loading") || viewScale > 1.01) return;

        if (stageClickTimer) {
          clearTimeout(stageClickTimer);
          stageClickTimer = null;
          return;
        }

        const rect = els.stage.getBoundingClientRect();
        const x = e.clientX - rect.left;
        stageClickTimer = setTimeout(() => {
          stageClickTimer = null;
          if (x < rect.width * 0.28) goTo(pageNum - 1);
          else if (x > rect.width * 0.72) goTo(pageNum + 1);
        }, 260);
      });

      window.addEventListener("resize", () => {
        if (pdfDoc) renderPage(pageNum);
      });

      /* ============================================================
       * 启动
       * 优先级：?file= → 最近阅读 → 弹出书架
       * ============================================================ */
      (async function boot() {
        await migrateFromLocalStorage();
        await loadBooksManifest();

        const params = new URLSearchParams(location.search);
        const fileParam = params.get("file");
        if (fileParam) {
          const hit = BOOKS.find((b) => b.file === fileParam) || {
            file: fileParam,
            title: fileParam.replace(/\.pdf$/i, ""),
            sub: fileParam,
            restricted: false,
          };
          loadBook(hit);
          return;
        }

        const lastBook = await idbGet(KEY_LAST_BOOK);
        if (lastBook && lastBook.file) {
          const fromList = BOOKS.find((b) => b.file === lastBook.file);
          const hit = fromList || {
            file: lastBook.file,
            title: lastBook.title || lastBook.file,
            sub: lastBook.sub || "",
            restricted: !!lastBook.restricted,
          };
          loadBook(hit).catch(() => {});
        } else {
          setTimeout(openShelf, 200);
        }
      })();
    </script>
  </body>
</html>
